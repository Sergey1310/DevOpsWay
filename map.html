<!-- Mode switcher -->

  <div class="mode-sep"></div>
  <button class="mode-btn" id="btn-system" onclick="setMode('system')">◉ SYSTEM MAP</button>
</div>

<!-- Filter bar (skill graph only) -->
<div class="map-filter-bar" id="filter-bar" style="top:108px">
  <button class="filter-btn active-all" data-filter="all" onclick="setFilter('all',this)">ВСЕ</button>

  <button class="filter-btn" data-filter="core"      onclick="setFilter('core',this)">⬡ CORE</button>

  <button class="filter-btn" data-filter="incident"  onclick="setFilter('incident',this)">◈ ИНЦИДЕНТЫ</button>
</div>

<!-- Legend -->
<div class="map-legend">
  <div class="legend-title">Статус</div>
  <div class="legend-item"><div class="legend-dot ld-locked"></div>Заблокировано</div>
  <div class="legend-item"><div class="legend-dot ld-available"></div>Доступно</div>
  <div class="legend-item"><div class="legend-dot ld-progress"></div>В процессе</div>
  <div class="legend-item"><div class="legend-dot ld-done"></div>Завершено</div>
  <div style="height:1px;background:rgba(255,255,255,.06);margin:6px 0"></div>
  <div class="legend-title">Тип узла</div>
  <div class="legend-type-row"><div class="legend-shape"><div class="ls-hex"></div></div>Core skill</div>
  <div class="legend-type-row"><div class="legend-shape"><div class="ls-rect"></div></div>Практика</div>
  <div class="legend-type-row"><div class="legend-shape"><div class="ls-diamond"></div></div>Инцидент</div>
</div>

<!-- Map -->
<div id="map-wrap">
  <div id="map-stage">
    <svg id="edges-svg"></svg>
    <!-- Nodes injected by JS -->
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<!-- Side Panel -->
<div id="side-panel">
  <button class="panel-close" onclick="closePanel()">✕</button>
  <div id="panel-content"></div>
</div>

<!-- Stats -->
<div class="map-stats">
  <div class="stat-item">
    <div class="stat-n" id="stat-done">0</div>
    <div class="stat-l">Освоено</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-item">

  <div class="stat-item">

    <div class="stat-l">Прогресс</div>
  </div>
  <div class="stat-divider"></div>

    <div class="stat-l">Практика</div>

  <div class="stat-item" style="cursor:pointer" onclick="setFilter('incident', document.querySelector('[data-filter=incident]'))" title="Показать инциденты">

    <div class="stat-l">Режим</div>
  </div>
</div>

// ─────────────────────────────────────────
//  STATUS from localStorage
// ─────────────────────────────────────────
function getNodeStatus(node) {
  // Map sprint IDs to localStorage progress
  if (!node.sprintIds || node.sprintIds.length === 0) return 'available';

  let totalTasks = 0, doneTasks = 0, anyProgress = false;

  node.sprintIds.forEach(sid => {
    const sprintData = SPRINTS ? SPRINTS.find(s => s.id === sid) : null;
    if (!sprintData) return;

    const sprintTasks = sprintData.instructions ? sprintData.instructions.length : 0;
    const doneArr = JSON.parse(localStorage.getItem('sp-done-' + sid) || '[]');
    const topicsArr = JSON.parse(localStorage.getItem('sp-top-' + sid) || '[]');

    totalTasks += sprintTasks;
    doneTasks += doneArr.length;
    if (doneArr.length > 0 || topicsArr.length > 0) anyProgress = true;
  });

  if (totalTasks === 0) return 'available';
  if (doneTasks >= totalTasks * 0.9) return 'done';
  if (anyProgress || doneTasks > 0) return 'progress';

  // Check prerequisites
  const prereqs = node.prereqs || [];
  for (const preId of prereqs) {
    const preNode = NODES.find(n => n.id === preId);
    if (preNode) {
      const preStatus = getNodeStatusById(preId);
      if (preStatus === 'locked') return 'locked';
    }
  }
  return 'available';
}

const statusCache = {};
function getNodeStatusById(id) {
  if (statusCache[id] !== undefined) return statusCache[id];
  const node = NODES.find(n => n.id === id);
  if (!node) return 'available';
  // Avoid infinite recursion
  statusCache[id] = 'available';
  const s = getNodeStatus(node);
  statusCache[id] = s;
  return s;
}

// Render edges
function renderEdges(highlightId = null, typeFilter = null) {
  svgEl.innerHTML = '';

  // Add glow filter
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>`;
  svgEl.appendChild(defs);

  const nodeMap = {};
  activeNodes.forEach(n => { nodeMap[n.id] = n; });

  const highlightEdges = new Set();
  if (highlightId) {
    activeEdges.forEach(([a,b]) => {
      if (a === highlightId || b === highlightId) {
        highlightEdges.add(a + '→' + b);
      }
    });
  }

  activeEdges.forEach(([aId, bId]) => {
    const a = nodeMap[aId], b = nodeMap[bId];
    if (!a || !b) return;

    const key = aId + '→' + bId;
    const isLit = highlightEdges.has(key);
    const isDim = highlightId && !isLit;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');

    // Curved bezier path
    const x1 = a.x, y1 = a.y;
    const x2 = b.x, y2 = b.y;
    const cy = (y1 + y2) / 2;
    const d = `M ${x1} ${y1} C ${x1} ${cy} ${x2} ${cy} ${x2} ${y2}`;

    path.setAttribute('d', d);
    path.setAttribute('class', 'edge' + (isLit?' lit':'') + (isDim?' dim':''));

    // Dim edges where neither endpoint matches type filter
    let typeDim = false;
    if (typeFilter && typeFilter !== 'all') {
      const aType = a.type || 'core';
      const bType = b.type || 'core';
      if (aType !== typeFilter && bType !== typeFilter) typeDim = true;
    }

    if (isLit) {
      const color = GROUP_COLORS[a.group] || '#38BDF8';
      path.style.stroke = color;
      path.setAttribute('filter','url(#glow)');
    }
    if (typeDim) path.style.opacity = '0.03';

    svgEl.appendChild(path);
  });
}

// Render nodes
const nodeEls = {};

// ─────────────────────────────────────────
//  renderMap — dataset-agnostic render
// ─────────────────────────────────────────
function renderMap(nodes, edges) {
  // Clear existing nodes (keep SVG, remove divs)
  Array.from(stage.children).forEach(el => {
    if (el !== svgEl) el.remove();
  });
  Object.keys(nodeEls).forEach(k => delete nodeEls[k]);

  // Update stage height
  const maxY = Math.max(...nodes.map(n => n.y)) + 140;
  stage.style.minHeight = maxY + 'px';
  svgEl.style.height    = maxY + 'px';

  // Re-run node render loop (uses activeNodes via closure)
  activeNodes = nodes;
  activeEdges = edges;

  nodes.forEach((node, idx) => {
    const status   = activeMode === 'system' ? 'available' : getNodeStatusById(node.id);
    const groupKey = node.group || node.layer || 'ops';
    const color    = GROUP_COLORS[groupKey] || '#38BDF8';
    const ntype    = node.type || (activeMode === 'system' ? 'system' : 'core');

    const el = document.createElement('div');
    el.className = `node ${status}${node.size === 'sm' ? ' sm' : ''}`;
    el.dataset.id    = node.id;
    el.dataset.group = groupKey;
    el.dataset.type  = ntype;
    el.style.left = node.x + 'px';
    el.style.top  = node.y + 'px';
    el.style.animationDelay = (idx * 28) + 'ms';

    const typeBadge = (ntype !== 'core' && ntype !== 'system') ? `
      <div class="node-type-badge type-badge-${ntype}">${ntype === 'practical' ? '▭' : '◈'}</div>` : '';

    el.innerHTML = `
      <div class="node-inner" style="position:relative">
        ${typeBadge}
        <div class="node-hex" style="color:${color}">${node.emoji}</div>
        <div class="node-label" style="color:${status === 'locked' ? 'rgba(100,116,139,.4)' : color}">${node.label}</div>
      </div>`;

    el.addEventListener('mouseenter', (e) => { showTooltip(e, node); renderEdges(node.id); });
    el.addEventListener('mouseleave', () => { hideTooltip(); renderEdges(); });
    el.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node, el); });

    stage.appendChild(el);
    nodeEls[node.id] = el;
  });

  // Group / layer lane labels
  const groupPositions2 = {};
  nodes.forEach(n => {
    const gk = n.group || n.layer || 'ops';
    if (!groupPositions2[gk]) groupPositions2[gk] = { minX: n.x, minY: n.y };
    groupPositions2[gk].minX = Math.min(groupPositions2[gk].minX, n.x);
    groupPositions2[gk].minY = Math.min(groupPositions2[gk].minY, n.y);
  });
  Object.entries(groupPositions2).forEach(([group, pos]) => {
    const lbl = document.createElement('div');
    lbl.className = activeMode === 'system' ? 'layer-lane' : 'group-label';
    lbl.style.left  = activeMode === 'system' ? '20px' : (pos.minX - 120) + 'px';
    lbl.style.top   = (pos.minY - 22) + 'px';
    lbl.style.color = GROUP_COLORS[group] || '#888';
    lbl.textContent = activeMode === 'system'
      ? (LAYER_META[group] ? LAYER_META[group].label : group)
      : (GROUP_LABELS[group] || group.toUpperCase());
    stage.appendChild(lbl);
  });

  renderEdges();
  updateStats();
}

// ─────────────────────────────────────────
//  setMode — swap between skill / system
// ─────────────────────────────────────────
function setMode(mode) {
  if (mode === activeMode) return;
  closePanel();
  activeMode = mode;
  localStorage.setItem('rdm-map-mode', mode);

  // Update button states
  document.getElementById('btn-skill').className  = 'mode-btn' + (mode === 'skill'  ? ' active' : '');
  document.getElementById('btn-system').className = 'mode-btn' + (mode === 'system' ? ' active active-system' : '');

  // Show/hide type filter bar (skill only)
  const fb = document.getElementById('filter-bar');
  if (fb) fb.style.display = mode === 'skill' ? 'flex' : 'none';

  // Update body class for CSS shape switching
  document.body.classList.toggle('mode-system', mode === 'system');

  // Animate switch
  document.body.classList.add('switching');
  setTimeout(() => document.body.classList.remove('switching'), 400);

  const nodes = mode === 'system' ? SYSTEM_NODES : NODES;
  const edges = mode === 'system' ? SYSTEM_EDGES : EDGES;
  renderMap(nodes, edges);

  // Update stats bar context label
  const contextEl = document.getElementById('stat-context');
  if (contextEl) contextEl.textContent = mode === 'system' ? 'SYSTEM MAP' : 'SKILL GRAPH';
}

// Initial render
renderMap(
  activeMode === 'system' ? SYSTEM_NODES : NODES,
  activeMode === 'system' ? SYSTEM_EDGES : EDGES
);
// Restore mode button state on load
if (activeMode === 'system') {
  document.getElementById('btn-skill').className  = 'mode-btn';
  document.getElementById('btn-system').className = 'mode-btn active active-system';
  document.getElementById('filter-bar').style.display = 'none';
  document.body.classList.add('mode-system');
}

const tooltip = document.getElementById('tooltip');

function showTooltip(e, node) {
  const status = getNodeStatusById(node.id);
  const statusLabel = {locked:'🔒 Заблокировано',available:'◦ Доступно',progress:'◎ В процессе',done:'✓ Завершено'}[status] || '';
  tooltip.innerHTML = `<strong>${node.label}</strong>${node.desc.substring(0,80)}...<br><span style="opacity:.5;margin-top:4px;display:block">${statusLabel}</span>`;
  tooltip.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  let x = e.clientX + 14, y = e.clientY - 10;
  if (x + 210 > window.innerWidth) x = e.clientX - 220;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

document.addEventListener('mousemove', (e) => {
  if (tooltip.classList.contains('visible')) moveTooltip(e);
});

// ─────────────────────────────────────────
//  SIDE PANEL
// ─────────────────────────────────────────
let selectedNodeEl = null;

function buildCrossLinks(node) {
  // Skill mode: show which system components this skill builds
  if (activeMode === 'skill') {
    const sysIds = SKILL_TO_SYSTEM[node.id];
    if (!sysIds || !sysIds.length) return '';
    const tags = sysIds.map(sid => {
      const sn = SYSTEM_NODES.find(n => n.id === sid);
      if (!sn) return '';
      return `<span class="panel-crosslink-tag" onclick="switchAndFocus('system','${sid}')">${sn.emoji} ${sn.label}</span>`;
    }).join('');
    return `<div class="panel-crosslink"><div class="panel-crosslink-title">◉ В системе</div>${tags}</div>`;
  }
  // System mode: show which skills teach this component
  if (activeMode === 'system' && node.skills && node.skills.length) {
    const tags = node.skills.map(skId => {
      const sk = NODES.find(n => n.id === skId);
      if (!sk) return '';
      return `<span class="panel-crosslink-tag" onclick="switchAndFocus('skill','${skId}')" style="color:#38BDF8;background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.2)">${sk.emoji} ${sk.label}</span>`;
    }).join('');
    return `<div class="panel-crosslink"><div class="panel-crosslink-title">◦ Изучается в</div>${tags}</div>`;
  }
  return '';
}

function switchAndFocus(mode, nodeId) {
  setMode(mode);
  setTimeout(() => {
    const el = nodeEls[nodeId];
    if (el) el.click();
  }, 380);
}

function selectNode(node, el) {
  if (selectedNodeEl) selectedNodeEl.classList.remove('selected');
  selectedNodeEl = el;
  el.classList.add('selected');

  const status = getNodeStatusById(node.id);
  const color  = GROUP_COLORS[node.group || node.layer] || '#38BDF8';
  const statusLabel = {locked:'Заблокировано',available:'Доступно',progress:'В процессе',done:'Завершено'}[status];
  const statusColor = {locked:'#64748b',available:'#38BDF8',progress:'#FFC443',done:'#34D399'}[status];

  // Sprint links
  const sprintLinks = (node.sprints || []).map((s, i) => {
    const sid = node.sprintIds?.[i];
    if (sid) {
      const padded = String(sid).padStart(2,'0');
      return `<a class="panel-tag sprint-tag" href="sprints/s${padded}.html">${s}</a>`;
    }
    return `<span class="panel-tag">${s}</span>`;
  }).join('');

  // Prerequisites
  const prereqTags = (node.prereqs || []).map(p => {
    const pn = NODES.find(n => n.id === p);
    return `<span class="panel-tag">${pn ? pn.label : p}</span>`;
  }).join('') || '<span class="panel-tag" style="opacity:.4">нет</span>';

  // Unlocks
  const unlockTags = (node.unlocks || []).map(u => {
    const un = NODES.find(n => n.id === u);
    return `<span class="panel-tag">${un ? un.label : u}</span>`;
  }).join('') || '<span class="panel-tag" style="opacity:.4">финал</span>';

  // Progress bar
  let progressPct = 0;
  if (status === 'done') progressPct = 100;
  else if (status === 'progress') {
    let total = 0, done = 0;
    (node.sprintIds || []).forEach(sid => {
      const sp = SPRINTS ? SPRINTS.find(s => s.id === sid) : null;
      if (sp) {
        total += sp.instructions.length;
        done  += JSON.parse(localStorage.getItem('sp-done-' + sid) || '[]').length;
      }
    });
    progressPct = total > 0 ? Math.round(done / total * 100) : 0;
  }

  document.getElementById('panel-content').innerHTML = `
    <div>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:12px">
        <span class="panel-group-tag" style="background:${color}18;color:${color};border:1px solid ${color}30;margin-bottom:0">
          ${GROUP_LABELS[node.group || node.layer] || node.group || node.layer || ''}
        </span>
        ${(()=>{
          const t = node.type||'core';
          const tColor = {core:'#38BDF8',practical:'#34D399',incident:'#EF4444'}[t];
          const tLabel = {core:'CORE SKILL',practical:'ПРАКТИКА',incident:'ИНЦИДЕНТ'}[t];
          const tShape = {core:'⬡',practical:'▭',incident:'◈'}[t];
          return '<span style="font-family:JetBrains Mono,monospace;font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:3px;background:'+tColor+'15;color:'+tColor+';border:1px solid '+tColor+'25">'+tShape+' '+tLabel+'</span>';
        })()}
      </div>
      <div class="panel-status-row">
        <div class="panel-status-dot" style="border-color:${statusColor};background:${statusColor}20"></div>
        <span class="panel-status-label" style="color:${statusColor}">${statusLabel}</span>
      </div>
      <div class="panel-title">${node.emoji} ${node.title}</div>
      <div class="panel-desc">${node.desc}</div>

      ${progressPct > 0 ? `
      <div class="panel-progress-bar">
        <div class="panel-progress-fill" style="width:${progressPct}%;background:${statusColor}"></div>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(148,163,184,.4);margin-top:6px;margin-bottom:16px">${progressPct}% завершено</div>
      ` : '<div style="margin-bottom:16px"></div>'}

      <div class="panel-divider"></div>

      <div class="panel-section">
        <div class="panel-section-title">Почему важно</div>
        <div class="panel-section-body">${node.why}</div>
      </div>

      <div class="panel-section">
        <div class="panel-section-title">Спринты</div>
        <div class="panel-tags">${sprintLinks}</div>
      </div>

      <div class="panel-section">
        <div class="panel-section-title">Требует</div>
        <div class="panel-tags">${prereqTags}</div>
      </div>

      <div class="panel-section">
        <div class="panel-section-title">Открывает</div>
        <div class="panel-tags">${unlockTags}</div>
      </div>

      ${buildCrossLinks(node)}


      ${node.example ? `
      <div class="panel-section">
        <div class="panel-section-title">Практика</div>
        <div class="panel-section-body">${node.example}</div>
      </div>` : ''}

      ${node.interview ? `
      <div class="panel-divider"></div>
      <div class="panel-interview">${node.interview}</div>` : ''}
    </div>`;

  document.getElementById('side-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('side-panel').classList.remove('open');
  if (selectedNodeEl) { selectedNodeEl.classList.remove('selected'); selectedNodeEl = null; }
  renderEdges();
}

// Close on outside click
document.getElementById('map-wrap').addEventListener('click', (e) => {
  if (!e.target.closest('.node') && !e.target.closest('#side-panel')) {
    closePanel();
  }
});

// ─────────────────────────────────────────
//  STATS
// ─────────────────────────────────────────
function updateStats() {
  let done = 0, progress = 0, cores = 0, practicals = 0, incidents = 0;
  activeNodes.forEach(n => {
    const s = getNodeStatusById(n.id);
    if (s === 'done') done++;
    else if (s === 'progress') progress++;
    const t = n.type || 'core';
    if (t === 'core') cores++;
    else if (t === 'practical') practicals++;
    else if (t === 'incident') incidents++;
  });
  const total = NODES.length;
  const pct = Math.round((done + progress * 0.5) / total * 100);
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-progress').textContent = progress;
  document.getElementById('stat-pct').textContent = pct + '%';
  const ce = document.getElementById('stat-core');      if(ce) ce.textContent = cores;
  const pe = document.getElementById('stat-practical'); if(pe) pe.textContent = practicals;
  const ie = document.getElementById('stat-incidents'); if(ie) ie.textContent = incidents;
}
updateStats();

// ─────────────────────────────────────────
//  FILTER BY TYPE
// ─────────────────────────────────────────
let activeFilter = 'all';

function setFilter(type, btn) {
  activeFilter = type;

  // Update button states
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
    if (b.dataset.filter === type) b.classList.add('active-' + type);
  });

  // Show/hide nodes
  Object.values(nodeEls).forEach(el => {
    const ntype = el.dataset.type || 'core';
    if (type === 'all' || ntype === type) {
      el.style.opacity = '';
      el.style.pointerEvents = '';
    } else {
      el.style.opacity = '0.06';
      el.style.pointerEvents = 'none';
    }
  });

  // Re-render edges with dim
  renderEdges(null, type);
}

// ─────────────────────────────────────────
//  PAN / DRAG
// ─────────────────────────────────────────
const wrap = document.getElementById('map-wrap');
let isDragging = false, startX, startY, scrollLeft, scrollTop;

wrap.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node') || e.target.closest('#side-panel')) return;
  isDragging = true;
  wrap.classList.add('grabbing');
  startX = e.pageX - wrap.offsetLeft;
  startY = e.pageY - wrap.offsetTop;
  scrollLeft = wrap.scrollLeft;
  scrollTop  = wrap.scrollTop;
});
document.addEventListener('mouseup',   () => { isDragging = false; wrap.classList.remove('grabbing'); });
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const x = e.pageX - wrap.offsetLeft;
  const y = e.pageY - wrap.offsetTop;
  wrap.scrollLeft = scrollLeft - (x - startX);
  wrap.scrollTop  = scrollTop  - (y - startY);
});

// Center on load
window.addEventListener('load', () => {
  const stageW = stage.offsetWidth;
  const wrapW  = wrap.offsetWidth;
  if (stageW > wrapW) {
    wrap.scrollLeft = (stageW - wrapW) / 2;
  }
});

// ─────────────────────────────────────────
//  KEYBOARD
// ─────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
});
</script>
</body>
